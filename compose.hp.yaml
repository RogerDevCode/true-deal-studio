name: true-deal-studio

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: true-deal-studio:web
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 80
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
